# Builds and tests every push and pull request. Uses no secrets and publishes nothing.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build (warnings are errors)
        run: dotnet build Kurobane.sln -c Release -nologo

      - name: Core tests
        run: dotnet test tests/Kurobane.Tests -c Release --no-build -nologo

      - name: Release tool tests run inside the Core suite; secret scan
        shell: powershell
        run: ./scripts/check-secrets.ps1
